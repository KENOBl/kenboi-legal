<!DOCTYPE html>
  <html lang="pl">
  <head>
  <meta charset="UTF-8">
  <title>Łączenie z TikTok…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 480px; margin: 4rem auto; padding: 0 1.5rem;
         text-align: center; color: #18181b; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .status { color: #71717a; margin: 1.5rem 0; }
  .error { color: #b91c1c; background: #fef2f2; padding: 1rem;
           border-radius: 8px; text-align: left; }
  a { color: #0f766e; }
  </style>
  </head>
  <body>
  <h1>Łączenie z TikTok</h1>
  <p class="status" id="status">Przekierowuję do panelu…</p>
  <p><a id="manual" href="#" style="display:none">
     Jeśli nie zostałeś przekierowany — kliknij tutaj
  </a></p>

  <script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    const statusEl = document.getElementById('status');
    const manualEl = document.getElementById('manual');

    if (error) {
      statusEl.innerHTML = '<div class="error"><strong>Błąd TikTok:</strong> '
        + error + (errorDesc ? '<br><small>' + errorDesc + '</small>' : '')
        + '</div>';
      return;
    }
    if (!code) {
      statusEl.innerHTML = '<div class="error">Brak kodu autoryzacji w URL.</div>';
      return;
    }

    const target = 'http://localhost:8000/tiktok/callback?code='
      + encodeURIComponent(code)
      + (state ? '&state=' + encodeURIComponent(state) : '');

    manualEl.href = target;
    manualEl.style.display = 'inline';
    statusEl.textContent = 'Przekierowuję do http://localhost:8000…';
    setTimeout(function() { window.location.href = target; }, 600);
  })();
  </script>
  </body>
  </html>
